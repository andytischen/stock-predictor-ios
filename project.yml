# XcodeGen project definition. Generate the .xcodeproj with:
#   brew install xcodegen && xcodegen generate
# then open StockPredictor.xcodeproj in Xcode.
name: StockPredictor
options:
  bundleIdPrefix: com.andytischen
  deploymentTarget:
    iOS: "16.0"
packages:
  GapModelKit:
    path: .
targets:
  StockPredictor:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: GapModelKit
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Gap Model
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andytischen.stockpredictor
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"

  # Randy's Global News First: the news layout over the published edition JSON.
  # It shares App/Views/AdSlotView.swift with the gap-model app so both keep the
  # same reserved advert units.
  RandysGlobalNewsFirst:
    type: application
    platform: iOS
    # ContentUnavailableView and the toolbar placements the layout uses are iOS 17.
    # Single-platform targets take a bare version string; a platform-keyed map
    # here is ignored and the target silently inherits the project's iOS 16.
    deploymentTarget: "17.0"
    sources:
      - NewsApp
      - path: App/Views/AdSlotView.swift
      - path: Sample/news.json
        buildPhase: resources
    dependencies:
      - package: GapModelKit
        product: GlobalNewsKit
    info:
      path: NewsApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: Randy's Global News First
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andytischen.randysglobalnewsfirst
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
