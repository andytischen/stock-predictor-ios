# XcodeGen project definition. Generate the .xcodeproj with:
#   brew install xcodegen && xcodegen generate
# then open StockPredictor.xcodeproj in Xcode.
name: StockPredictor
options:
  bundleIdPrefix: com.andytischen
  deploymentTarget:
    iOS: "16.0"
packages:
  GapModelKit:
    path: .
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.7.0
targets:
  StockPredictor:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: GapModelKit
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        # The committed plist is the source of truth; XcodeGen would otherwise
        # rewrite it from an `info:` block and drop the AdMob keys.
        INFOPLIST_FILE: App/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.andytischen.stockpredictor
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
