name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # GapModelKit is Foundation-only, so its tests run on a Linux Swift image.
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test GapModelKit
        run: swift test
